<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>الأسطول الذهبي - المالك</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#000000;color:#f8fafc}
button,input,select,textarea{font-family:inherit}button{touch-action:manipulation}
.card{background:#0f172a;border-radius:14px;box-shadow:0 4px 16px #00000088;border:1px solid #1e293b}
.navbtn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;color:#cbd5e1;width:100%;font-weight:700;font-size:12px}
.navbtn.active,.navbtn:hover{background:#334155;color:#ffb703}
.modal{position:fixed;inset:0;background:#000000cc;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:8px;overflow:auto}
.modalbox{width:min(720px,100%);margin-top:15px;background:#0f172a;border-radius:18px;padding:12px;box-shadow:0 15px 50px #000f;border:1px solid #334155;color:#f8fafc}
.field{width:100%;border:1px solid #334155;border-radius:10px;padding:9px 10px;background:#020617;color:#f8fafc;outline:none;font-size:12px}
.field:focus{border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b22}
.label{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:4px;display:block}
.btn{border-radius:10px;padding:8px 12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px}
.btn-primary{background:#d97706;color:#fff}.btn-green{background:#059669;color:#fff}.btn-red{background:#dc2626;color:#fff}.btn-dark{background:#1e293b;color:#fff}.btn-gray{background:#1e293b;color:#cbd5e1}
.kpi{padding:12px;border-radius:14px;color:white;min-height:90px}
.small{font-size:11px;color:#94a3b8}.hidden{display:none!important}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:100;padding:10px 16px;border-radius:12px;color:#fff;box-shadow:0 8px 30px #0008;font-size:12px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:7px;border-bottom:1px solid #1e293b;text-align:right;white-space:nowrap;font-size:11px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.open{background:#064e3b;color:#dcfce7}.closed{background:#1e293b;color:#94a3b8}
.good{color:#34d399}.bad{color:#f87171}
@media(max-width:1024px){#sidebar{display:none}.mobile-nav{display:flex!important}.content{padding:8px!important;padding-bottom:80px!important}}
</style>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<section id="loginScreen" class="min-h-screen flex items-center justify-center p-3 bg-black">
  <div class="w-full max-w-sm card p-5 text-center">
    <div class="w-20 h-20 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-4xl shadow-xl border border-amber-500/30">🚗</div>
    <h1 class="text-xl font-black mt-3 text-white">الأسطول الذهبي</h1>
    <p class="text-slate-400 text-xs mt-1">إدارة السيارات والرحلات</p>
    <div class="mt-5 text-right">
      <label class="label">كلمة المرور</label>
      <input id="pin" class="field text-center text-xl tracking-[.3em]" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <button id="loginBtn" class="btn btn-primary w-full mt-3 py-2.5">🔐 دخول</button>
    <p id="firebaseStatus" class="small mt-3">جاري الاتصال بالسحابة...</p>
  </div>
</section>

<div id="app" class="hidden min-h-screen bg-black">
<header class="bg-slate-950 border-b border-slate-800 text-white h-12 flex items-center justify-between px-3 sticky top-0 z-50">
  <b class="text-xs">🚗 الأسطول الذهبي</b>
  <div class="flex items-center gap-2"><span id="syncText" class="text-[11px] text-emerald-400">متصل</span><button id="logoutBtn" class="btn btn-gray text-[11px] py-1 px-2">خروج</button></div>
</header>
<div class="flex">
<aside id="sidebar" class="w-56 bg-slate-950 border-l border-slate-800 min-h-[calc(100vh-48px)] p-2.5 sticky top-12 self-start space-y-1">
  <button class="navbtn active" data-view="dashboard">📊 التقارير</button>
  <button class="navbtn" data-view="availableTrips">📍 الرحلات المتاحة</button>
  <button class="navbtn" data-view="drivers">👨‍✈️ السائقين</button>
  <button class="navbtn" data-view="cars">🚗 السيارات</button>
  <button class="navbtn" data-view="customers">👥 العملاء</button>
  <button class="navbtn" data-view="shifts">🚦 الورديات</button>
  <button class="navbtn" data-view="treasury">🪙 الخزنة</button>
  <button class="navbtn" data-view="debts">📝 الديون والالتزامات</button>
  <button class="navbtn" data-view="archive">🗄️ الأرشيف</button>
</aside>
<main class="content flex-1 p-2.5 min-w-0"><div id="view"></div></main>
</div>
<div class="mobile-nav hidden fixed bottom-0 inset-x-0 bg-slate-950 border-t border-slate-800 z-50 p-1 gap-1 overflow-x-auto justify-around">
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="dashboard">📊<span>التقارير</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="availableTrips">📍<span>الرحلات</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="drivers">👨‍✈️<span>السائقين</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="cars">🚗<span>السيارات</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="shifts">🚦<span>الورديات</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="treasury">🪙<span>الخزنة</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="debts">📝<span>الديون</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="archive">🗄️<span>الأرشيف</span></button>
</div>
</div>
<div id="modal" class="hidden modal"><div id="modalBox" class="modalbox"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {getDatabase,ref,onValue,push,set,update,remove} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import {getStorage,ref as sRef,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyAuIdAJksajVw-NAWUvsgNOhoITUiL1wTE",
  authDomain:"beesw-al-sawy.firebaseapp.com",
  databaseURL:"https://fleetsmart-2513b-default-rtdb.firebaseio.com",
  projectId:"beesw-al-sawy",
  storageBucket:"beesw-al-sawy.firebasestorage.app",
  messagingSenderId:"313509851153",
  appId:"1:313509851153:android:ef2a5e68e3e630017901b0"
};

let app,db,storage;
let cloudReady=false;

function setStatus(t,type){
  const el=document.getElementById("firebaseStatus");
  if(el){el.textContent=t;el.className="small "+(type==="ok"?"text-emerald-400":"text-red-400")}
}
function toast(t,bad=false){
  const x=document.getElementById("toast");
  x.textContent=t;x.className="toast "+(bad?"bg-red-600":"bg-emerald-600");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>x.classList.add("hidden"),2600);
}

try{
  app=initializeApp(firebaseConfig);
  db=getDatabase(app);
  storage=getStorage(app);
  cloudReady=true;
  setStatus("تم تجهيز الاتصال بالسحابة","ok");
}catch(e){
  console.error(e);
  setStatus("خطأ إعداد Firebase: "+e.message,"bad");
}

const paths=["drivers","cars","customers","shifts","trips","expenses","treasury","rentPayments","archives","availableTrips","debts","settings","advances"];
const state={view:"dashboard",data:{}};
paths.forEach(p=>state.data[p]={});

const money=n=>(Number(n)||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2})+" ج.م";
const dateTime=t=>new Date(t||Date.now()).toLocaleString("ar-EG");
const vals=o=>Object.entries(o||{}).map(([id,v])=>({...v,id}));
const val=id=>document.getElementById(id)?.value?.trim()||"";
const num=id=>Number(document.getElementById(id)?.value||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
window.closeModal=closeModal;

function checkAlerts(){
  const today=new Date();
  const currentMonth=today.getMonth();
  const currentYear=today.getFullYear();
  let alerts=[];

  vals(state.data.cars).forEach(c=>{
    if(c.status==="إيجار"&&c.rentDate){
      const rentDay=parseInt(c.rentDate);
      if(!isNaN(rentDay)){
        const dueDate=new Date(currentYear,currentMonth,rentDay);
        const diffDays=Math.ceil((dueDate-today)/(1000*60*60*24));
        if(diffDays>=0&&diffDays<=3){
          alerts.push(`🚗 ميعاد إيجار السيارة (${c.brand||""} ${c.model||""}) مستحق خلال ${diffDays===0?"اليوم!":diffDays+" أيام"}`);
        }
      }
    }
  });

  vals(state.data.debts).forEach(d=>{
    if(d.dueDate){
      const dueDay=parseInt(d.dueDate);
      if(!isNaN(dueDay)){
        const dueDate=new Date(currentYear,currentMonth,dueDay);
        const diffDays=Math.ceil((dueDate-today)/(1000*60*60*24));
        if(diffDays>=0&&diffDays<=3){
          alerts.push(`📝 ميعاد سداد الالتزام (${d.name}) مستحق خلال ${diffDays===0?"اليوم!":diffDays+" أيام"}`);
        }
      }
    }
  });

  if(alerts.length>0&&!window.__alertShown){
    window.__alertShown=true;
    toast(alerts[0],true);
  }
}

function showApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
  checkAlerts();
}
function login(){
  if(val("pin")!=="6352")return toast("كلمة المرور غير صحيحة",true);
  showApp();
}
document.getElementById("loginBtn").onclick=login;
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
document.getElementById("logoutBtn").onclick=()=>{
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("pin").value="";
};

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.view===state.view));
  render();
});

if(cloudReady){
  onValue(ref(db),snap=>{
    const d=snap.val()||{};
    paths.forEach(p=>state.data[p]=d[p]||{});
    document.getElementById("syncText").textContent="متصل";
    document.getElementById("syncText").className="text-[11px] text-emerald-400";
    setStatus("متصل بالسحابة","ok");
    if(!document.getElementById("app").classList.contains("hidden")){
      render();
      checkAlerts();
    }
  },err=>{
    console.error(err);
    document.getElementById("syncText").textContent="خطأ السحابة";
    document.getElementById("syncText").className="text-[11px] text-red-400";
    setStatus("تعذر قراءة قاعدة البيانات: "+err.message,"bad");
  });
}

function layout(title,sub=""){return `<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><h2 class="text-lg font-black text-white">${title}</h2><p class="small">${sub}</p></div></div>`}

function shiftCalc(s){
  const trips=vals(state.data.trips).filter(t=>t.shiftId===s.id);
  const ex=vals(state.data.expenses).filter(e=>e.shiftId===s.id);
  const revenue=trips.reduce((a,t)=>a+(Number(t.amount)||0),0);
  const expenses=ex.filter(e=>e.type!=="مصروف شخصي للسائق").reduce((a,e)=>a+(Number(e.amount)||0),0);
  const personal=ex.filter(e=>e.type==="مصروف شخصي للسائق").reduce((a,e)=>a+(Number(e.amount)||0),0);
  const pct=revenue*(Number(s.driverPercent)||0)/100;
  return {trips,ex,revenue,expenses,personal,pct,net:revenue-expenses-pct};
}

function driverBalance(id){
  const d=state.data.drivers[id]||{};
  const opening=Number(d.openingBalance??d.initBalance)||0;
  let earned=0,paid=0,adv=0,advPaid=0;
  vals(state.data.shifts).filter(s=>s.driverId===id).forEach(s=>{
    const c=shiftCalc(s);
    earned+=Math.max(0,Number(s.driverDue??(c.revenue-c.pct-c.personal))||0);
    paid+=Number(s.paidNow)||0;
  });
  vals(state.data.advances).filter(a=>a.partyType==="driver"&&a.partyId===id).forEach(a=>{
    adv+=Number(a.amount)||0;advPaid+=Number(a.paid)||0;
  });
  return {opening,earned,paid,advOutstanding:adv-advPaid,balance:opening+earned-paid-adv+advPaid};
}

function carBalance(id){
  const c=state.data.cars[id]||{};
  const opening=Number(c.openingBalance??c.initBalance)||0;
  let due=0,paid=0,adv=0,advPaid=0;
  vals(state.data.rentPayments).filter(x=>x.carId===id).forEach(x=>{
    due+=Number(x.dueAmount)||0;paid+=Number(x.amount)||0;
  });
  vals(state.data.advances).filter(a=>a.partyType==="car"&&a.partyId===id).forEach(a=>{
    adv+=Number(a.amount)||0;advPaid+=Number(a.paid)||0;
  });
  return {opening,rentDue:due,rentPaid:paid,advOutstanding:adv-advPaid,balance:opening+due-paid-adv+advPaid};
}

async function treasuryRecord(amount,description,type){
  if(!cloudReady)return;
  const r=push(ref(db,"treasury"));
  await set(r,{id:r.key,amount:Number(amount)||0,description,type,createdAt:Date.now()});
}

function dashboard(){
  const ss=vals(state.data.shifts);
  const rev=ss.reduce((a,s)=>a+shiftCalc(s).revenue,0);
  const ex=ss.reduce((a,s)=>a+shiftCalc(s).expenses,0);
  const pct=ss.reduce((a,s)=>a+shiftCalc(s).pct,0);
  return layout("التقارير","بيانات مرتبطة مباشرة بالسحابة")+
  `<div class="grid grid-cols-2 gap-2">
    <div class="kpi bg-slate-900 border border-slate-800">الإيرادات<br><b class="text-lg sm:text-xl mt-1 block">${money(rev)}</b></div>
    <div class="kpi bg-red-950/60 border border-red-900/40">المصاريف<br><b class="text-lg sm:text-xl mt-1 block">${money(ex)}</b></div>
    <div class="kpi bg-amber-950/60 border border-amber-900/40">نسب السائقين<br><b class="text-lg sm:text-xl mt-1 block">${money(pct)}</b></div>
    <div class="kpi bg-emerald-950/60 border border-emerald-900/40">الصافي<br><b class="text-lg sm:text-xl mt-1 block">${money(rev-ex-pct)}</b></div>
  </div>`;
}

function drivers(){
  return layout("السائقين","الرصيد الافتتاحي والسداد والسلف والتفاصيل")+
  `<button class="btn btn-primary mb-2 text-xs" data-action="newDriver">+ إضافة سائق</button>
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-2">
  ${vals(state.data.drivers).map(d=>{
    const b=driverBalance(d.id);
    return `<div class="card p-2.5">
      <b class="text-sm text-white">👨‍✈️ ${esc(d.name)}</b>
      <div class="small mt-0.5">${esc(d.phone||"")}</div>
      <div class="grid grid-cols-2 gap-2 mt-2 text-[11px]">
        <span>الرصيد الافتتاحي<br><b class="text-white">${money(b.opening)}</b></span>
        <span>المستحق<br><b class="text-white">${money(Math.max(0,b.balance))}</b></span>
        <span>السلف المتبقية<br><b class="text-white">${money(b.advOutstanding)}</b></span>
        <span>النسبة<br><b class="text-white">${Number(d.percent||0)}%</b></span>
      </div>
      <div class="flex flex-wrap gap-1 mt-2.5">
        <button class="btn btn-green text-[10px] py-1 px-2" data-action="driverPay" data-id="${d.id}">💵 سداد</button>
        <button class="btn btn-primary text-[10px] py-1 px-2" data-action="driverAdvance" data-id="${d.id}">＋ سلفة</button>
        <button class="btn btn-dark text-[10px] py-1 px-2 border border-slate-700" data-action="driverDetails" data-id="${d.id}">📋 تفاصيل</button>
        <button class="btn btn-gray text-[10px] py-1 px-2" data-action="editDriver" data-id="${d.id}">تعديل</button>
      </div>
    </div>`;
  }).join("")||"<p class='small'>لا يوجد سائقون.</p>"}</div>`;
}

function driverForm(id){
  const d=id?state.data.drivers[id]:{};
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">بيانات السائق</h3>
  <div class="grid md:grid-cols-2 gap-2">
    <div><label class="label">الاسم</label><input id="dName" class="field" value="${esc(d.name||"")}"></div>
    <div><label class="label">الهاتف</label><input id="dPhone" class="field" value="${esc(d.phone||"")}"></div>
    <div><label class="label">النسبة %</label><input id="dPct" class="field" type="number" value="${d.percent??30}"></div>
    <div><label class="label">الرصيد الافتتاحي</label><input id="dOpen" class="field" type="number" step="0.01" value="${d.openingBalance??d.initBalance??0}"></div>
  </div>
  <div class="flex gap-2 mt-3"><button id="saveDriver" class="btn btn-primary text-xs">حفظ</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("saveDriver").onclick=async()=>{
    const x={name:val("dName"),phone:val("dPhone"),percent:num("dPct"),openingBalance:num("dOpen"),updatedAt:Date.now()};
    if(!x.name)return toast("أدخل اسم السائق",true);
    try{
      if(id)await update(ref(db,"drivers/"+id),x);
      else{const r=push(ref(db,"drivers"));await set(r,{...x,id:r.key,createdAt:Date.now()})}
      closeModal();toast("تم حفظ السائق");render();
    }catch(e){toast("تعذر الحفظ: "+e.message,true)}
  };
}

function driverPay(id){payForm("سداد السائق","driver",id,Math.max(0,driverBalance(id).balance))}
function driverAdvance(id){advanceForm("driver",id)}

function cars(){
  return layout("السيارات","إدارة السيارات والمالكين")+
  `<button class="btn btn-primary mb-2 text-xs" data-action="newCar">+ إضافة سيارة</button>
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-2">
  ${vals(state.data.cars).map(c=>{
    const b=carBalance(c.id);
    return `<div class="card p-2.5">
      <div class="text-sm font-black text-white">🚗 ${esc(c.brand||c.name||"سيارة")} ${esc(c.model||"")} ${esc(c.year||"")}</div>
      <div class="small mt-0.5">الحالة: ${esc(c.status||"ملك")} ${c.status==="إيجار"?`<br>المالك: ${esc(c.ownerName||"")} (${esc(c.ownerPhone||"")})<br>الإيجار: ${money(c.rentMonthly)} - يوم السداد: ${esc(c.rentDate||"")}`:""}</div>
      <div class="grid grid-cols-2 gap-2 mt-2 text-[11px]">
        <span>الرصيد الافتتاحي<br><b class="text-white">${money(b.opening)}</b></span>
        <span>${c.status==="إيجار"?"الإيجار المستحق":"مستحقات أخرى"}<br><b class="text-white">${money(b.rentDue)}</b></span>
        <span>المدفوع<br><b class="text-white">${money(b.rentPaid)}</b></span>
        <span>السلف المتبقية<br><b class="text-white">${money(b.advOutstanding)}</b></span>
      </div>
      <div class="mt-2 p-1.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px]">الرصيد الحالي:
        <b class="${b.balance>=0?"good":"bad"}">${money(Math.abs(b.balance))} ${b.balance>=0?"له":"عليه"}</b>
      </div>
      <div class="flex flex-wrap gap-1 mt-2.5">
        <button class="btn btn-green text-[10px] py-1 px-2" data-action="carRentPay" data-id="${c.id}">💵 سداد</button>
        <button class="btn btn-primary text-[10px] py-1 px-2" data-action="carAdvance" data-id="${c.id}">＋ سلفة</button>
        <button class="btn btn-dark text-[10px] py-1 px-2 border border-slate-700" data-action="carDetails" data-id="${c.id}">📋 تفاصيل</button>
        <button class="btn btn-gray text-[10px] py-1 px-2" data-action="editCar" data-id="${c.id}">تعديل</button>
      </div>
    </div>`;
  }).join("")||"<p class='small'>لا توجد سيارات.</p>"}</div>`;
}

function carForm(id){
  const c=id?state.data.cars[id]:{};
  const isRent=(c.status||"ملك")==="إيجار";
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">بيانات السيارة</h3>
  <div class="grid md:grid-cols-2 gap-2">

function payForm(title,type,id){
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">${title}</h3>
  <label class="label">المبلغ المدفوع</label><input id="payValue" class="field" type="number" step="0.01">
  <label class="label mt-2">طريقة الدفع</label>
  <select id="payMethod" class="field"><option>كاش</option><option>انستاباي</option><option>محفظة إلكترونية</option><option>تحويل بنكي</option></select>
  <div class="flex gap-2 mt-3"><button id="confirmPay" class="btn btn-green text-xs">تأكيد السداد</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("confirmPay").onclick=async()=>{
    const amount=num("payValue");
    if(amount<=0)return toast("المبلغ غير صحيح",true);
    try{
      if(type==="driver"){
        const d=state.data.drivers[id],r=push(ref(db,"payments"));
        await set(r,{id:r.key,partyType:"driver",partyId:id,amount,method:val("payMethod"),createdAt:Date.now()});
        await treasuryRecord(-amount,"سداد للسائق: "+(d?.name||""),"سداد سائق");
        const shifts=vals(state.data.shifts).filter(s=>s.driverId===id).sort((a,b)=>(a.openedAt||0)-(b.openedAt||0));
        let left=amount;
        for(const s of shifts){
          const due=Number(s.driverDue)||0,paid=Number(s.paidNow)||0,remain=Math.max(0,due-paid);
          if(remain<=0)continue;
          const x=Math.min(left,remain);
          await update(ref(db,"shifts/"+s.id),{paidNow:paid+x});
          left-=x;if(left<=0)break;
        }
      }else{
        const c=state.data.cars[id],r=push(ref(db,"rentPayments"));
        await set(r,{id:r.key,carId:id,amount,dueAmount:0,method:val("payMethod"),createdAt:Date.now()});
        await treasuryRecord(-amount,"سداد سيارة: "+(c?.brand||""),"سداد سيارة");
      }
      closeModal();toast("تم السداد وتسجيله في الخزنة");render();
    }catch(e){toast("تعذر تسجيل السداد: "+e.message,true)}
  };
}

function closeShift(id){
  const s=state.data.shifts[id];if(!s||s.status!=="مفتوحة")return;
  const c=shiftCalc(s);
  openModal(`<h3 class="text-base font-black text-white">🔒 إنهاء الوردية</h3><p class="mt-2 text-xs">الإيراد: <b class="text-white">${money(c.revenue)}</b></p><p class="text-xs">الصافي: <b class="text-white">${money(c.net)}</b></p><div class="flex gap-2 mt-3"><button id="confirmClose" class="btn btn-dark text-xs border border-slate-700">تأكيد الإغلاق</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("confirmClose").onclick=async()=>{
    await update(ref(db,"shifts/"+id),{status:"منتهية",closedAt:Date.now(),revenue:c.revenue,expenses:c.expenses,net:c.net,driverDue:Math.max(0,c.revenue-c.pct-c.personal)});
    closeModal();toast("تم إغلاق الوردية");render();
  };
}

function tripForm(shiftId){
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">إضافة رحلة</h3><input id="tAmount" class="field" type="number" placeholder="المبلغ"><div class="flex gap-2 mt-3"><button id="saveTrip" class="btn btn-primary text-xs">حفظ</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("saveTrip").onclick=async()=>{
    if(num("tAmount")<=0)return toast("أدخل المبلغ",true);
    await set(push(ref(db,"trips")),{shiftId,amount:num("tAmount"),status:"نشطة",createdAt:Date.now()});
    closeModal();toast("تم حفظ الرحلة");shiftDetails(shiftId);
  };
}

function expenseForm(shiftId){
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">تسجيل مصروف</h3>
  <div class="grid gap-2">
    <select id="eType" class="field"><option>بنزين</option><option>صيانة</option><option>مصروف شخصي للسائق</option><option>أخرى</option></select>
    <input id="eAmount" class="field" type="number" placeholder="المبلغ">
    <input id="eNote" class="field" placeholder="ملاحظة">
    <div>
      <label class="label">صورة إيصال المصروف (اختياري)</label>
      <input id="eImage" class="field text-[11px]" type="file" accept="image/*">
    </div>
  </div>
  <div class="flex gap-2 mt-3"><button id="saveExpense" class="btn btn-red text-xs">حفظ المصروف</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);

  document.getElementById("saveExpense").onclick=async()=>{
    const amount=num("eAmount");
    if(amount<=0)return toast("أدخل المبلغ",true);
    toast("جاري حفظ المصروف...",false);

    let imageUrl="";
    const fileInput=document.getElementById("eImage");
    if(fileInput.files[0]){
      try{
        const file=fileInput.files[0];
        const sRefPath=sRef(storage, "expenses/"+Date.now()+"_"+file.name);
        const snapshot=await uploadBytes(sRefPath, file);
        imageUrl=await getDownloadURL(snapshot.ref);
      }catch(err){
        console.error(err);
        toast("فشل رفع الصورة، سيتم حفظ المصروف بدونها",true);
      }
    }

    await set(push(ref(db,"expenses")),{
      shiftId,
      amount,
      type:val("eType"),
      note:val("eNote"),
      imageUrl,
      createdAt:Date.now()
    });
    closeModal();
    toast("تم حفظ المصروف بنجاح");
    shiftDetails(shiftId);
  };
}

function treasury(){
  const init=Number(state.data.settings?.vaultInitBalance)||0;
  const tx=vals(state.data.treasury).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const total=tx.reduce((a,x)=>a+(Number(x.amount)||0),0);
  return layout("الخزنة","حركات الخزنة والسيولة")+
  `<div class="grid grid-cols-2 gap-2 mb-2">
    <div class="kpi bg-slate-900 border border-slate-800 col-span-2">الرصيد الحالي<b class="text-xl sm:text-2xl block mt-1 text-white">${money(init+total)}</b></div>
    <button data-action="treasuryIn" class="btn btn-green h-12 text-xs">＋ دخل</button>
    <button data-action="treasuryOut" class="btn btn-red h-12 text-xs">－ خرج</button>
  </div>
  <div class="card p-2.5 mb-2"><h3 class="font-black text-xs text-white mb-1.5">الرصيد الافتتاحي</h3><div class="flex gap-2"><input id="vaultInitInput" class="field text-xs" type="number" value="${init}"><button id="saveVaultInit" class="btn btn-primary text-xs">حفظ</button></div></div>
  <div class="card p-1.5 tablewrap"><table class="table text-[11px]"><thead><tr><th>التاريخ</th><th>البيان</th><th>النوع</th><th>المبلغ</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${dateTime(x.createdAt)}</td><td>${esc(x.description||"")}</td><td>${esc(x.type||"")}</td><td>${money(x.amount)}</td></tr>`).join("")}</tbody></table></div>`;
}

function treasuryForm(type){
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">${type}</h3><input id="trAmount" class="field" type="number" placeholder="المبلغ"><input id="trDesc" class="field mt-2" placeholder="البيان"><div class="flex gap-2 mt-3"><button id="saveTreasury" class="btn btn-primary text-xs">حفظ</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("saveTreasury").onclick=async()=>{if(num("trAmount")<=0)return toast("أدخل مبلغ صحيح",true);await treasuryRecord(type==="دخل"?num("trAmount"):-num("trAmount"),val("trDesc"),type+" - حركة");closeModal();toast("تم الحفظ");render()};
}

function monthlyObligations(){
  const debts=vals(state.data.debts);
  const carRent=vals(state.data.cars).filter(c=>c.status==="إيجار").reduce((a,c)=>a+(Number(c.rentMonthly)||0),0);
  const houseRent=debts.filter(d=>d.type==="إيجار بيت").reduce((a,d)=>a+(Number(d.monthlyPayment||d.amount)||0),0);
  const debtMonthly=debts.filter(d=>d.type!=="إيجار بيت"&&d.type!=="سلفة").reduce((a,d)=>a+(Number(d.monthlyPayment)||0),0);
  const driverDue=vals(state.data.drivers).reduce((a,d)=>a+Math.max(0,driverBalance(d.id).balance),0);
  return {carRent,houseRent,debtMonthly,driverDue,total:carRent+houseRent+debtMonthly+driverDue};
}

function debtsView(){
  const ds=vals(state.data.debts);
  const total=ds.filter(d=>d.type!=="سلفة"&&d.type!=="الجمعية").reduce((a,d)=>a+(Number(d.amount)||0),0);
  const ob=monthlyObligations();
  return layout("الديون والالتزامات","السداد والسلف والفوائد")+
  `<div class="grid md:grid-cols-2 gap-2 mb-2">
    <div class="kpi bg-slate-900 border border-slate-800">إجمالي الدين المتبقي<b class="text-lg sm:text-xl block mt-1 text-white">${money(total)}</b></div>
    <div class="kpi bg-amber-950/60 border border-amber-900/40">المطلوب هذا الشهر<b class="text-lg sm:text-xl block mt-1 text-white">${money(ob.total)}</b></div>
  </div>
  <button class="btn btn-primary mb-2 text-xs" data-action="newDebt">+ إضافة دين / التزام</button>
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-2">${ds.map(d=>`<div class="card p-2.5">
    <b class="text-white text-xs">${esc(d.name)}</b><div class="small mt-0.5">${esc(d.type)} ${d.dueDate?`• سداد: ${d.dueDate}`:""}</div>
    <div class="mt-1.5 text-[11px]">المتبقي: <b class="text-white">${money(d.amount)}</b></div>
    ${d.type==="دين بفائدة شهرية"||d.dueDate?`<div class="small mt-0.5">القسط/الفائدة: ${money(d.monthlyPayment)}</div>`:""}
    <div class="flex flex-wrap gap-1 mt-2.5">
      <button class="btn btn-green text-[10px] py-1 px-1.5" data-action="debtPay" data-id="${d.id}">سداد</button>
      ${d.type==="دين بفائدة شهرية"?`<button class="btn btn-primary text-[10px] py-1 px-1.5" data-action="interestPay" data-id="${d.id}">فائدة</button>`:""}
      <button class="btn btn-dark text-[10px] py-1 px-1.5" data-action="debtAdvance" data-id="${d.id}">＋ سلفة</button>
      <button class="btn btn-gray text-[10px] py-1 px-1.5" data-action="debtDetails" data-id="${d.id}">تفاصيل</button>
      <button class="btn btn-red text-[10px] py-1 px-1.5" data-action="deleteDebt" data-id="${d.id}">حذف</button>
    </div>
  </div>`).join("")||"<p class='small'>لا توجد ديون.</p>"}</div>`;
}

function debtForm(){
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">إضافة دين / التزام</h3>
  <div class="grid gap-2">
    <div><label class="label">اسم الدائن</label><input id="dn" class="field"></div>
    <div>
      <label class="label">النوع</label>
      <select id="dt" class="field" onchange="document.getElementById('debtExtra').classList.toggle('hidden',this.value!=='سلفة')">
        <option>دين ثابت</option><option>دين بفائدة شهرية</option><option>الجمعية</option><option>إيجار بيت</option><option>أخرى</option><option>سلفة</option>
      </select>
    </div>
    <div id="debtExtra" class="hidden grid md:grid-cols-2 gap-2">
      <select id="loanDir" class="field"><option value="له">له</option><option value="عليه">عليه</option></select>
      <select id="loanSource" class="field"><option value="رأس المال">سلفة من رأس المال</option><option value="الفائدة الشهرية">سلفة من الفائدة الشهرية</option></select>
    </div>
    <div><label class="label">المبلغ الأساسي</label><input id="da" class="field" type="number"></div>
    <div><label class="label">القسط / الفائدة الشهرية</label><input id="dm" class="field" type="number"></div>
    <div><label class="label">يوم السداد (1 إلى 31)</label><input id="dDate" class="field" type="number" min="1" max="31"></div>
    <div class="text-[10px] text-amber-400 font-bold">🔔 تنبيه تلقائي قبل الموعد بـ 3 أيام.</div>
  </div>
  <div class="flex gap-2 mt-3"><button id="sd" class="btn btn-primary text-xs">حفظ</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);

  document.getElementById("sd").onclick=async()=>{
    const x={name:val("dn"),type:val("dt"),amount:num("da"),monthlyPayment:num("dm"),dueDate:val("dDate"),createdAt:Date.now()};
    if(!x.name||x.amount<=0)return toast("أكمل البيانات",true);
    if(x.type==="سلفة"){x.loanDirection=val("loanDir");x.loanSource=val("loanSource");}
    const r=push(ref(db,"debts"));await set(r,{...x,id:r.key});closeModal();toast("تم حفظ الالتزام");render();
  };
}

function debtPay(id){const d=state.data.debts[id];if(d)payDebtForm(d,false)}
function interestPay(id){const d=state.data.debts[id];if(d)payDebtForm(d,true)}
function payDebtForm(d,interest){
  const max=interest?Number(d.monthlyPayment)||0:Number(d.amount)||0;
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">${interest?"سداد فائدة الشهر":"سداد الدين"} — ${esc(d.name)}</h3><p class="text-xs">المتاح: <b class="text-white">${money(max)}</b></p><input id="debtPayAmount" class="field mt-2" type="number" value="${max}"><select id="debtPayMethod" class="field mt-2"><option>كاش</option><option>انستاباي</option><option>محفظة إلكترونية</option><option>تحويل بنكي</option></select><div class="flex gap-2 mt-3"><button id="doDebtPay" class="btn btn-green text-xs">تأكيد</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("doDebtPay").onclick=async()=>{
    const p=num("debtPayAmount");if(p<=0||p>max)return toast("المبلغ غير صحيح",true);
    if(!interest)await update(ref(db,"debts/"+d.id),{amount:Math.max(0,(Number(d.amount)||0)-p)});
    await treasuryRecord(-p,(interest?"سداد فائدة: ":"سداد دين: ")+d.name,"سداد دين");
    closeModal();toast("تم السداد وتسجيله في الخزنة");render();
  };
}

function debtAdvance(id){
  const d=state.data.debts[id];if(!d)return;
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">＋ سلفة — ${esc(d.name)}</h3><div class="grid gap-2"><input id="debtAdvAmount" class="field" type="number" placeholder="قيمة السلفة"><select id="debtAdvDir" class="field"><option value="له">له</option><option value="عليه">عليه</option></select><select id="debtAdvSource" class="field"><option value="رأس المال">من رأس المال</option><option value="الفائدة الشهرية">من الفائدة الشهرية</option></select><select id="debtAdvMode" class="field"><option value="كلي">سداد كلي</option><option value="جزئي">سداد جزئي</option></select><input id="debtAdvMonthly" class="field" type="number" placeholder="السداد الشهري"></div><div class="flex gap-2 mt-3"><button id="saveDebtAdv" class="btn btn-primary text-xs">حفظ</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("saveDebtAdv").onclick=async()=>{
    const amount=num("debtAdvAmount"),mode=val("debtAdvMode"),monthly=num("debtAdvMonthly");
    if(amount<=0)return toast("أدخل مبلغ السلفة",true);
    if(mode==="جزئي"&&monthly<=0)return toast("أدخل السداد الشهري",true);
    const r=push(ref(db,"advances"));
    await set(r,{id:r.key,partyType:"debt",partyId:id,amount,paid:0,mode,monthlyPayment:mode==="جزئي"?monthly:amount,loanDirection:val("debtAdvDir"),loanSource:val("debtAdvSource"),createdAt:Date.now()});
    const sign=val("debtAdvDir")==="له"?-1:1;
    await treasuryRecord(sign*amount,`سلفة ${val("debtAdvDir")} للدين ${d.name}`,"سلفة دين");
    closeModal();toast("تم تسجيل السلفة");render();
  };
}

function debtDetails(id){
  const d=state.data.debts[id];if(!d)return;
  openModal(`<h3 class="text-base font-black text-white">${esc(d.name)}</h3><p class="mt-2 text-xs">المتبقي: <b class="text-white">${money(d.amount)}</b></p><p class="text-xs">القسط/الفائدة: <b class="text-white">${money(d.monthlyPayment||0)}</b></p><p class="text-xs mt-1">يوم السداد: <b class="text-white">${d.dueDate?d.dueDate+" من كل شهر":"غير محدد"}</b></p><button class="btn btn-gray text-xs mt-3" onclick="closeModal()">إغلاق</button>`);
}

function archive(){const arr=vals(state.data.archives);return layout("الأرشيف","البيانات المؤرشفة")+`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-2">${arr.map(a=>`<div class="card p-2.5 text-xs"><b class="text-white">${esc(a.shiftNo||"")}</b><div class="small">${esc(a.driverName||"")}</div><div>الإيراد: <b class="text-white">${money(a.revenue)}</b></div></div>`).join("")||"<p class='small'>لا توجد سجلات.</p>"}</div>`}

function render(){
  const v=document.getElementById("view");
  if(state.view==="dashboard")v.innerHTML=dashboard();
  else if(state.view==="availableTrips")v.innerHTML=availableTrips();
  else if(state.view==="drivers")v.innerHTML=drivers();
  else if(state.view==="cars")v.innerHTML=cars();
  else if(state.view==="customers")v.innerHTML=customers();
  else if(state.view==="shifts")v.innerHTML=shifts();
  else if(state.view==="treasury")v.innerHTML=treasury();
  else if(state.view==="debts")v.innerHTML=debtsView();
  else if(state.view==="archive")v.innerHTML=archive();
  bindView();
}

function bindView(){
  document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>actions(b.dataset.action,b.dataset.id));
  const sv=document.getElementById("saveVaultInit");
  if(sv)sv.onclick=async()=>{await update(ref(db,"settings"),{vaultInitBalance:num("vaultInitInput")});toast("تم حفظ الرصيد");render()};
}

async function actions(a,id){
  if(a==="newDriver")return driverForm();
  if(a==="editDriver")return driverForm(id);
  if(a==="driverPay")return driverPay(id);
  if(a==="driverAdvance")return driverAdvance(id);
  if(a==="driverDetails")return details("driver",id);
  if(a==="newCar")return carForm();
  if(a==="editCar")return carForm(id);
  if(a==="carRentPay")return carRentPay(id);
  if(a==="carAdvance")return carAdvance(id);
  if(a==="carDetails")return details("car",id);
  if(a==="newCustomer")return customerForm();
  if(a==="customerDetails")return customerDetails(id);
  if(a==="newShift")return shiftForm();
  if(a==="shiftDetails")return shiftDetails(id);
  if(a==="closeShift")return closeShift(id);
  if(a==="addTrip")return tripForm(id);
  if(a==="addExpense")return expenseForm(id);
  if(a==="newAvailableTrip")return availableTripForm();
  if(a==="editAvailableTrip")return availableTripForm(id);
  if(a==="deleteAvailableTrip")return deleteAvailableTrip(id);
  if(a==="treasuryIn")return treasuryForm("دخل");
  if(a==="treasuryOut")return treasuryForm("خرج");
  if(a==="newDebt")return debtForm();
  if(a==="debtPay")return debtPay(id);
  if(a==="interestPay")return interestPay(id);
  if(a==="debtAdvance")return debtAdvance(id);
  if(a==="debtDetails")return debtDetails(id);
  if(a==="deleteDebt"){if(confirm("حذف الالتزام؟")){await remove(ref(db,"debts/"+id));toast("تم الحذف");render()}}
}
</script>
</body>
    </html>
