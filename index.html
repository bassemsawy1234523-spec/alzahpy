<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>الأسطول الذهبي - المالك</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.fuel-preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;border:1px solid #334155;background:#020617}
.fuel-read{padding:10px;border-radius:12px;background:#020617;border:1px solid #334155}
.fuel-bars{display:flex;gap:3px;direction:ltr;align-items:end;height:24px}
.fuel-bars i{display:block;width:12px;height:18px;border-radius:3px 3px 2px 2px;background:#1e293b;border:1px solid #475569}
.fuel-bars i.on{height:22px;background:#f59e0b;border-color:#fbbf24}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#000000;color:#f8fafc}
button,input,select,textarea{font-family:inherit}button{touch-action:manipulation}
.card{background:#0f172a;border-radius:14px;box-shadow:0 4px 16px #00000088;border:1px solid #1e293b}
.navbtn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;color:#cbd5e1;width:100%;font-weight:700;font-size:12px}
.navbtn.active,.navbtn:hover{background:#334155;color:#ffb703}
.modal{position:fixed;inset:0;background:#000000cc;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:8px;overflow:auto}
.modalbox{width:min(720px,100%);margin-top:15px;background:#0f172a;border-radius:18px;padding:12px;box-shadow:0 15px 50px #000f;border:1px solid #334155;color:#f8fafc}
.field{width:100%;border:1px solid #334155;border-radius:10px;padding:9px 10px;background:#020617;color:#f8fafc;outline:none;font-size:12px}
.field:focus{border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b22}
.label{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:4px;display:block}
.btn{border-radius:10px;padding:8px 12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px}
.btn-primary{background:#d97706;color:#fff}.btn-green{background:#059669;color:#fff}.btn-red{background:#dc2626;color:#fff}.btn-dark{background:#1e293b;color:#fff}.btn-gray{background:#1e293b;color:#cbd5e1}
.kpi{padding:12px;border-radius:14px;color:white;min-height:90px}
.small{font-size:11px;color:#94a3b8}.hidden{display:none!important}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:100;padding:10px 16px;border-radius:12px;color:#fff;box-shadow:0 8px 30px #0008;font-size:12px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:7px;border-bottom:1px solid #1e293b;text-align:right;white-space:nowrap;font-size:11px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.open{background:#064e3b;color:#dcfce7}.closed{background:#1e293b;color:#94a3b8}
.good{color:#34d399}.bad{color:#f87171}
@media(max-width:1024px){#sidebar{display:none}.mobile-nav{display:flex!important}.content{padding:8px!important;padding-bottom:80px!important}}
</style>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<section id="loginScreen" class="min-h-screen flex items-center justify-center p-3 bg-black">
  <div class="w-full max-w-sm card p-5 text-center">
    <div class="w-20 h-20 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-4xl shadow-xl border border-amber-500/30">🚗</div>
    <h1 class="text-xl font-black mt-3 text-white">الأسطول الذهبي</h1>
    <p class="text-slate-400 text-xs mt-1">إدارة السيارات والرحلات</p>
    <div class="mt-5 text-right">
      <label class="label">كلمة المرور</label>
      <input id="pin" class="field text-center text-xl tracking-[.3em]" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <button id="loginBtn" type="button" class="btn btn-primary w-full mt-3 py-2.5"
onclick="window.goldenFleetLogin && window.goldenFleetLogin()">🔐 دخول</button>
    <p id="firebaseStatus" class="small mt-3">جاري الاتصال بالسحابة... يمكنك الدخول، وسيتم تحميل البيانات عند اكتمال الاتصال.</p>
  </div>
</section>

<div id="app" class="hidden min-h-screen bg-black">
<header class="bg-slate-950 border-b border-slate-800 text-white h-12 flex items-center justify-between px-3 sticky top-0 z-50">
  <b class="text-xs">🚗 الأسطول الذهبي</b>
  <div class="flex items-center gap-2"><span id="syncText" class="text-[11px] text-emerald-400">متصل</span><button id="logoutBtn" class="btn btn-gray text-[11px] py-1 px-2">خروج</button></div>
</header>
<div class="flex">
<aside id="sidebar" class="w-56 bg-slate-950 border-l border-slate-800 min-h-[calc(100vh-48px)] p-2.5 sticky top-12 self-start space-y-1">
  <button class="navbtn active" data-view="dashboard">📊 التقارير</button>
  <button class="navbtn" data-view="availableTrips">📍 الرحلات المتاحة</button>
  <button class="navbtn" data-view="drivers">👨‍✈️ السائقين</button>
  <button class="navbtn" data-view="cars">🚗 السيارات</button>
  <button class="navbtn" data-view="customers">👥 العملاء</button>
  <button class="navbtn" data-view="shifts">🚦 الورديات</button>
  <button class="navbtn" data-view="treasury">🪙 الخزنة</button>
  <button class="navbtn" data-view="debts">📝 الديون والالتزامات</button>
  <button class="navbtn" data-view="archive">🗄️ الأرشيف</button>
</aside>
<main class="content flex-1 p-2.5 min-w-0"><div id="view"></div></main>
</div>
<div class="mobile-nav hidden fixed bottom-0 inset-x-0 bg-slate-950 border-t border-slate-800 z-50 p-1 gap-1 overflow-x-auto justify-around">
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="dashboard">📊<span>التقارير</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="availableTrips">📍<span>الرحلات</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="drivers">👨‍✈️<span>السائقين</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="cars">🚗<span>السيارات</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="shifts">🚦<span>الورديات</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="treasury">🪙<span>الخزنة</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="debts">📝<span>الديون</span></button>
  <button class="navbtn text-[10px] flex-col py-1 px-1" data-view="archive">🗄️<span>الأرشيف</span></button>
</div>
</div>
<div id="modal" class="hidden modal"><div id="modalBox" class="modalbox"></div></div>

<script>
window.goldenFleetLogin=function(){
  const pin=document.getElementById("pin");
  const loginScreen=document.getElementById("loginScreen");
  const app=document.getElementById("app");
  const toastEl=document.getElementById("toast");
  if(!pin)return;
  if(pin.value!=="6352"){
    if(toastEl){
      toastEl.textContent="كلمة المرور غير صحيحة";
      toastEl.className="toast bg-red-600";
      clearTimeout(window.__gfLoginToast);
      window.__gfLoginToast=setTimeout(()=>toastEl.classList.add("hidden"),2600);
    }
    return;
  }
  if(loginScreen)loginScreen.classList.add("hidden");
  if(app)app.classList.remove("hidden");
  // Firebase will render the data as soon as the connection becomes available.
  if(typeof window.__goldenFleetRender==="function")window.__goldenFleetRender();
};
document.addEventListener("DOMContentLoaded",()=>{
  const p=document.getElementById("pin");
  if(p)p.addEventListener("keydown",e=>{if(e.key==="Enter")window.goldenFleetLogin();});
});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {getDatabase,ref,onValue,push,set,update,remove} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import {getStorage,ref as sRef,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyAuIdAJksajVw-NAWUvsgNOhoITUiL1wTE",
  authDomain:"beesw-al-sawy.firebaseapp.com",
  databaseURL:"https://fleetsmart-2513b-default-rtdb.firebaseio.com",
  projectId:"beesw-al-sawy",
  storageBucket:"beesw-al-sawy.firebasestorage.app",
  messagingSenderId:"313509851153",
  appId:"1:313509851153:android:ef2a5e68e3e630017901b0"
};

let app,db,storage;
let cloudReady=false;

function setStatus(t,type){
  const el=document.getElementById("firebaseStatus");
  if(el){el.textContent=t;el.className="small "+(type==="ok"?"text-emerald-400":"text-red-400")}
}
function toast(t,bad=false){
  const x=document.getElementById("toast");
  x.textContent=t;x.className="toast "+(bad?"bg-red-600":"bg-emerald-600");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>x.classList.add("hidden"),2600);
}

try{
  app=initializeApp(firebaseConfig);
  db=getDatabase(app);
  storage=getStorage(app);
  cloudReady=true;
  setStatus("تم تجهيز الاتصال بالسحابة","ok");
}catch(e){
  console.error(e);
  setStatus("خطأ إعداد Firebase: "+e.message,"bad");
}

const paths=["drivers","cars","customers","shifts","trips","expenses","treasury","rentPayments","archives","availableTrips","debts","settings","advances"];
const state={view:"dashboard",data:{}};
paths.forEach(p=>state.data[p]={});

const money=n=>(Number(n)||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2})+" ج.م";
const dateTime=t=>new Date(t||Date.now()).toLocaleString("ar-EG");
const vals=o=>Object.entries(o||{}).map(([id,v])=>({...v,id}));
const val=id=>document.getElementById(id)?.value?.trim()||"";
const num=id=>Number(document.getElementById(id)?.value||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
window.closeModal=closeModal;

function checkAlerts(){
  const today=new Date();
  const currentMonth=today.getMonth();
  const currentYear=today.getFullYear();
  let alerts=[];

  vals(state.data.cars).forEach(c=>{
    if(c.status==="إيجار"&&c.rentDate){
      const rentDay=parseInt(c.rentDate);
      if(!isNaN(rentDay)){
        const dueDate=new Date(currentYear,currentMonth,rentDay);
        const diffDays=Math.ceil((dueDate-today)/(1000*60*60*24));
        if(diffDays>=0&&diffDays<=3){
          alerts.push(`🚗 ميعاد إيجار السيارة (${c.brand||""} ${c.model||""}) مستحق خلال ${diffDays===0?"اليوم!":diffDays+" أيام"}`);
        }
      }
    }
  });

  vals(state.data.debts).forEach(d=>{
    if(d.dueDate){
      const dueDay=parseInt(d.dueDate);
      if(!isNaN(dueDay)){
        const dueDate=new Date(currentYear,currentMonth,dueDay);
        const diffDays=Math.ceil((dueDate-today)/(1000*60*60*24));
        if(diffDays>=0&&diffDays<=3){
          alerts.push(`📝 ميعاد سداد الالتزام (${d.name}) مستحق خلال ${diffDays===0?"اليوم!":diffDays+" أيام"}`);
        }
      }
    }
  });

  if(alerts.length>0&&!window.__alertShown){
    window.__alertShown=true;
    toast(alerts[0],true);
  }
}

function showApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
  checkAlerts();
}
window.__goldenFleetRender=render;
function login(){
  if(val("pin")!=="6352")return toast("كلمة المرور غير صحيحة",true);
  showApp();
}
document.getElementById("loginBtn").onclick=login;
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
document.getElementById("logoutBtn").onclick=()=>{
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("pin").value="";
};

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.view===state.view));
  render();
});

if(cloudReady){
  onValue(ref(db),snap=>{
    const d=snap.val()||{};
    paths.forEach(p=>state.data[p]=d[p]||{});
    document.getElementById("syncText").textContent="متصل";
    document.getElementById("syncText").className="text-[11px] text-emerald-400";
    setStatus("متصل بالسحابة","ok");
    if(!document.getElementById("app").classList.contains("hidden")){
      render();
      checkAlerts();
    }
  },err=>{
    console.error(err);
    document.getElementById("syncText").textContent="خطأ السحابة";
    document.getElementById("syncText").className="text-[11px] text-red-400";
    setStatus("تعذر قراءة قاعدة البيانات: "+err.message,"bad");
  });
}

function layout(title,sub=""){return `<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><h2 class="text-lg font-black text-white">${title}</h2><p class="small">${sub}</p></div></div>`}


function expenseImage(e){
  return e?.fuelPhoto || e?.imageUrl || e?.image || e?.photoUrl || e?.receiptUrl || e?.photo || "";
}
function expenseImageHtml(e,small=false){
  const u=expenseImage(e);
  if(!u)return `<span class="small text-[10px] text-red-500">بدون صورة</span>`;
  const cls=small
    ?"w-12 h-12 object-cover rounded-lg border border-slate-700 cursor-pointer"
    :"w-20 h-20 object-cover rounded-xl border border-slate-700 cursor-pointer";
  return `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" class="${cls}" alt="صورة المصروف" loading="lazy"></a>`;
}

function shiftCalc(s){
  const trips=vals(state.data.trips).filter(t=>t.shiftId===s.id);
  const ex=vals(state.data.expenses).filter(e=>e.shiftId===s.id);
  const revenue=trips.reduce((a,t)=>a+(Number(t.amount)||0),0);
  const expenses=ex.filter(e=>e.type!=="مصروف شخصي للسائق").reduce((a,e)=>a+(Number(e.amount)||0),0);
  const personal=ex.filter(e=>e.type==="مصروف شخصي للسائق").reduce((a,e)=>a+(Number(e.amount)||0),0);
  const driverBase=Math.max(0,revenue-expenses);
  const pct=driverBase*(Number(s.driverPercent)||0)/100;
  const driverDue=pct-personal;
  const custody=Number(s.custody)||0;
  const startBars=Number(s.fuelStartBars);
  const endBars=Number(s.fuelEndBars);
  const fuelAdjustment=(Number.isFinite(startBars)&&Number.isFinite(endBars))
    ? (startBars-endBars)*90 : (Number(s.fuelAdjustment)||0);
  const net=revenue-expenses-driverDue+custody-fuelAdjustment;
  return {trips,ex,revenue,expenses,personal,pct,driverBase,driverDue,custody,startBars,endBars,fuelAdjustment,net};
}
function fuelBarsHtml(n){
  n=Math.max(0,Math.min(10,Number(n)||0));
  return `<div class="fuel-bars">${Array.from({length:10},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`;
}
function fuelInfoHtml(s){
  const hasStart=Number.isFinite(Number(s.fuelStartBars));
  const hasEnd=Number.isFinite(Number(s.fuelEndBars));
  const start=hasStart?Number(s.fuelStartBars):null;
  const end=hasEnd?Number(s.fuelEndBars):null;
  const adj=hasStart&&hasEnd?(start-end)*90:null;
  return `<div class="card p-2 mb-3">
    <h4 class="font-black text-xs text-amber-400 mb-2">⛽ البنزين</h4>
    <div class="grid grid-cols-2 gap-2 text-[11px]">
      <div class="fuel-read">بداية الوردية<br>${hasStart?`<b>${start}/10 شرطات</b>${fuelBarsHtml(start)}<div class="small mt-1">${money(start*90)}</div>`:`<span class="small">لم تُقرأ الصورة</span>`}</div>
      <div class="fuel-read">نهاية الوردية<br>${hasEnd?`<b>${end}/10 شرطات</b>${fuelBarsHtml(end)}<div class="small mt-1">${money(end*90)}</div>`:`<span class="small">لم تُسجل بعد</span>`}</div>
    </div>
    ${adj!==null?`<div class="mt-2 text-xs">تسوية البنزين: <b class="${adj>0?"bad":adj<0?"good":"text-white"}">${adj>0?"خصم ":"إضافة "}${money(Math.abs(adj))}</b></div>`:""}
    <div class="small mt-1">10 شرطات = 900 ج.م، والشرطة الواحدة = 90 ج.م.</div>
    ${s.fuelStartPhoto?`<a href="${esc(s.fuelStartPhoto)}" target="_blank"><img src="${esc(s.fuelStartPhoto)}" class="fuel-preview mt-2" alt="صورة بنزين بداية الوردية"></a>`:""}
    ${s.fuelEndPhoto?`<a href="${esc(s.fuelEndPhoto)}" target="_blank"><img src="${esc(s.fuelEndPhoto)}" class="fuel-preview mt-2" alt="صورة بنزين نهاية الوردية"></a>`:""}
  </div>`;
}

function partyTreasuryAdjustment(type,id){
  return vals(state.data.treasury).filter(x=>
    x.affectsPartyBalance===true &&
    x.partyType===type &&
    x.partyId===id
  ).reduce((a,x)=>a+(Number(x.amount)||0),0);
}

function driverBalance(id){
  const d=state.data.drivers[id]||{};
  const opening=Number(d.openingBalance??d.initBalance)||0;
  let earned=0,paid=0,adv=0,advPaid=0;

  // لا تدخل الوردية في حساب السائق إلا بعد إنهائها.
  vals(state.data.shifts).filter(s=>s.driverId===id&&s.status==="منتهية").forEach(s=>{
    const c=shiftCalc(s);
    earned+=Number(s.driverDue??c.driverDue)||0;
    paid+=Number(s.paidNow)||0;
  });

  vals(state.data.advances).filter(a=>a.partyType==="driver"&&a.partyId===id).forEach(a=>{
    adv+=Number(a.amount)||0;
    advPaid+=Number(a.paid)||0;
  });

  const treasuryAdjust=partyTreasuryAdjustment("driver",id);
  return {
    opening,earned,paid,treasuryAdjust,
    advOutstanding:adv-advPaid,
    balance:opening+earned-paid+treasuryAdjust-adv+advPaid
  };
}

function carBalance(id){
  const c=state.data.cars[id]||{};
  const opening=Number(c.openingBalance??c.initBalance)||0;

  // صافي كل وردية منتهية تخص السيارة يدخل مباشرة في حساب السيارة.
  const shiftNet=vals(state.data.shifts)
    .filter(s=>s.carId===id&&s.status==="منتهية")
    .reduce((a,s)=>a+(Number(s.net??shiftCalc(s).net)||0),0);

  let due=0,paid=0,adv=0,advPaid=0;
  vals(state.data.rentPayments).filter(x=>x.carId===id).forEach(x=>{
    due+=Number(x.dueAmount)||0;
    paid+=Number(x.amount)||0;
  });

  vals(state.data.advances).filter(a=>a.partyType==="car"&&a.partyId===id).forEach(a=>{
    adv+=Number(a.amount)||0;
    advPaid+=Number(a.paid)||0;
  });

  // مصروفات الخزنة المربوطة بالسيارة تخصم من حسابها.
  const treasuryAdjust=partyTreasuryAdjustment("car",id);

  return {
    opening,shiftNet,rentDue:due,rentPaid:paid,treasuryAdjust,
    advOutstanding:adv-advPaid,
    balance:opening+shiftNet+due-paid+treasuryAdjust-adv+advPaid
  };
}

async function treasuryRecord(amount,description,type,partyType="",partyId="",affectsPartyBalance=false,extra={}){
  if(!cloudReady)return;
  const r=push(ref(db,"treasury"));
  await set(r,{
    id:r.key,
    amount:Number(amount)||0,
    description,
    type,
    createdAt:Date.now(),
    ...(partyType?{partyType}:{}),
    ...(partyId?{partyId}:{}),
    ...(affectsPartyBalance?{affectsPartyBalance:true}:{}),
    ...extra
  });
}

function dashboard(){
  const ss=vals(state.data.shifts);
  const rev=ss.reduce((a,s)=>a+shiftCalc(s).revenue,0);
  const ex=ss.reduce((a,s)=>a+shiftCalc(s).expenses,0);
  const pct=ss.reduce((a,s)=>a+shiftCalc(s).pct,0);
  return layout("التقارير","بيانات مرتبطة مباشرة بالسحابة")+
  `<div class="grid grid-cols-2 gap-2">
    <div class="kpi bg-slate-900 border border-slate-800">الإيرادات<br><b class="text-lg sm:text-xl mt-1 block">${money(rev)}</b></div>
    <div class="kpi bg-red-950/60 border border-red-900/40">المصاريف<br><b class="text-lg sm:text-xl mt-1 block">${money(ex)}</b></div>
    <div class="kpi bg-amber-950/60 border border-amber-900/40">نسب السائقين<br><b class="text-lg sm:text-xl mt-1 block">${money(pct)}</b></div>
    <div class="kpi bg-emerald-950/60 border border-emerald-900/40">الصافي<br><b class="text-lg sm:text-xl mt-1 block">${money(ss.reduce((a,s)=>a+shiftCalc(s).net,0))}</b></div>
  </div>`;
}

function drivers(){
  return layout("السائقين","الرصيد الافتتاحي والسداد والسلف والتفاصيل")+
  `<button class="btn btn-primary mb-2 text-xs" data-action="newDriver">+ إضافة سائق</button>
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-2">
  ${vals(state.data.drivers).map(d=>{

function payForm(title,type,id){
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">${title}</h3>
  <label class="label">المبلغ المدفوع</label><input id="payValue" class="field" type="number" step="0.01">
  <label class="label mt-2">طريقة الدفع</label>
  <select id="payMethod" class="field"><option>كاش</option><option>انستاباي</option><option>محفظة إلكترونية</option><option>تحويل بنكي</option></select>
  <div class="flex gap-2 mt-3"><button id="confirmPay" class="btn btn-green text-xs">تأكيد السداد</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById("confirmPay").onclick=async()=>{
    const amount=num("payValue");
    if(amount<=0)return toast("المبلغ غير صحيح",true);
    try{
      if(type==="driver"){
        const d=state.data.drivers[id],r=push(ref(db,"payments"));
        await set(r,{id:r.key,partyType:"driver",partyId:id,amount,method:val("payMethod"),createdAt:Date.now()});
        await treasuryRecord(-amount,"سداد للسائق: "+(d?.name||""),"سداد سائق","driver",id,false);
        const shifts=vals(state.data.shifts).filter(s=>s.driverId===id).sort((a,b)=>(a.openedAt||0)-(b.openedAt||0));
        let left=amount;
        for(const s of shifts){
          const due=Number(s.driverDue)||0,paid=Number(s.paidNow)||0,remain=Math.max(0,due-paid);
          if(remain<=0)continue;
          const x=Math.min(left,remain);
          await update(ref(db,"shifts/"+s.id),{paidNow:paid+x});
          left-=x;if(left<=0)break;
        }
      }else{
        const c=state.data.cars[id],r=push(ref(db,"rentPayments"));
        await set(r,{id:r.key,carId:id,amount,dueAmount:0,method:val("payMethod"),createdAt:Date.now()});
        await treasuryRecord(-amount,"سداد سيارة: "+(c?.brand||""),"سداد سيارة","car",id,false);
      }
      closeModal();toast("تم السداد وتسجيله في الخزنة");render();
    }catch(e){toast("تعذر تسجيل السداد: "+e.message,true)}
  };
}

const GEMINI_KEY_STORAGE="goldenFleetGeminiKey";
const GEMINI_MODEL="gemini-3.7-flash";
function getGeminiKey(){return localStorage.getItem(GEMINI_KEY_STORAGE)||"";}
function setGeminiKey(k){k=k.trim();k?localStorage.setItem(GEMINI_KEY_STORAGE,k):localStorage.removeItem(GEMINI_KEY_STORAGE);}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(file);});}
async function uploadShiftFuelPhoto(file,shiftId,side){
  const r=sRef(storage,`shifts/${shiftId}/fuel_${side}_${Date.now()}.jpg`);
  await uploadBytes(r,file,{contentType:file.type||"image/jpeg"});
  return await getDownloadURL(r);
}
async function readFuelBarsFromImage(file){
  const key=getGeminiKey();
  if(!key)throw new Error("أدخل مفتاح Gemini من زر إعداد القراءة أولاً.");
  const dataUrl=await fileToDataUrl(file);
  const base64=dataUrl.split(",")[1], mime=file.type||"image/jpeg";
  const prompt=`أنت محلل عداد بنزين. الصورة لعداد به 10 شرطات كحد أقصى. اقرأ فقط عدد الشرطات المضيئة أو الممتلئة فعلياً من 0 إلى 10. لا تخمّن. إذا كانت الصورة غير واضحة أو العداد غير ظاهر جيداً اجعل confidence أقل من 0.70. أعد JSON فقط: {"bars":0,"confidence":0.0}`;
  const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;
  const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:base64}}]}],generationConfig:{temperature:0,responseMimeType:"application/json"}};
  const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok)throw new Error("فشل تحليل الصورة من Gemini: HTTP "+res.status);
  const j=await res.json();
  const raw=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
  let p; try{p=JSON.parse(raw)}catch{const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error("تعذر قراءة نتيجة تحليل العداد.");p=JSON.parse(m[0]);}
  const bars=Number(p.bars), confidence=Number(p.confidence);
  if(!Number.isFinite(bars)||bars<0||bars>10)throw new Error("نتيجة عدد الشرطات غير صالحة.");
  if(!Number.isFinite(confidence)||confidence<0.70)throw new Error("الصورة غير واضحة. أعد تصوير العداد من الأمام وبوضوح.");
  return {bars:Math.round(bars),confidence};
}

  <p class="small mb-3">مفتاح Gemini مطلوب لقراءة العداد تلقائياً. المفتاح يُحفظ على هذا الجهاز فقط. للأمان الأفضل لاحقاً ننقل المفتاح إلى Firebase Cloud Function.</p>
  <label class="label">Gemini API Key</label><input id="geminiKey" class="field" type="password" value="${esc(getGeminiKey())}" placeholder="ضع مفتاح Gemini هنا">
  <div class="small mt-2">10 شرطات = 900 ج.م، الشرطة = 90 ج.م.</div>
  <div class="flex gap-2 mt-3"><button id="saveGeminiKey" class="btn btn-primary text-xs">حفظ المفتاح</button><button class="btn btn-gray text-xs" onclick="closeModal()">إغلاق</button></div>`);
  document.getElementById("saveGeminiKey").onclick=()=>{setGeminiKey(val("geminiKey"));closeModal();toast(getGeminiKey()?"تم حفظ مفتاح القراءة":"تم حذف مفتاح القراءة");};
}

function shiftForm(){
  const ds=vals(state.data.drivers),cs=vals(state.data.cars);
  if(!ds.length||!cs.length)return toast("أضف سائقاً وسيارة أولاً",true);
  openModal(`<h3 class="text-base font-black mb-2.5 text-white">فتح وردية</h3>
  <div class="grid md:grid-cols-2 gap-2">
    <div><label class="label">السائق</label><select id="sDriver" class="field">${ds.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></div>
    <div><label class="label">السيارة</label><select id="sCar" class="field">${cs.map(c=>`<option value="${c.id}">${esc(c.brand||c.name||"")} ${esc(c.model||"")}</option>`).join("")}</select></div>
    <div><label class="label">العُهدة المستلمة</label><input id="sCustody" class="field" type="number" min="0" step="0.01" value="0" placeholder="مثلاً 500"></div>
  </div>
  <div class="card p-2 mt-3"><div class="flex items-center justify-between gap-2"><div><b class="text-xs text-amber-400">⛽ استلام البنزين</b><div class="small">صوّر العداد وسيقرأ التطبيق عدد الشرطات تلقائياً.</div></div><button id="startFuelBtn" class="btn btn-green text-xs">📷 تصوير العداد</button></div><div id="startFuelResult" class="small mt-2">لم يتم تصوير العداد بعد.</div></div>
  <div class="flex gap-2 mt-3"><button id="saveShift" class="btn btn-primary text-xs">فتح الوردية</button><button class="btn btn-gray text-xs" onclick="closeModal()">إلغاء</button><button class="btn btn-dark text-xs" onclick="fuelSettings()">⚙️ إعداد القراءة</button></div>`);
  let openingFuel={bars:null,photo:""};
  document.getElementById("startFuelBtn").onclick=async()=>{
    const input=document.createElement("input"); input.type="file"; input.accept="image/*"; input.capture="environment"; input.style.display="none"; document.body.appendChild(input);
    input.onchange=async()=>{const file=input.files?.[0];input.remove();if(!file)return;try{
      toast("⏳ جاري قراءة عداد البنزين...");
      const result=await readFuelBarsFromImage(file);
      const tempRef=push(ref(db,"shifts")); const photo=await uploadShiftFuelPhoto(file,tempRef.key,"start"); await remove(tempRef);
      openingFuel={bars:result.bars,photo};
      document.getElementById("startFuelResult").innerHTML=`<b class="text-emerald-400">${result.bars}/10 شرطات</b> — ${money(result.bars*90)}<br>${fuelBarsHtml(result.bars)}`;
      toast("تمت قراءة عداد البنزين بنجاح");
    }catch(e){console.error(e);toast(e.message||"تعذر قراءة العداد",true);}};
    input.click();
  };
  document.getElementById("saveShift").onclick=async()=>{
    const d=state.data.drivers[val("sDriver")],c=state.data.cars[val("sCar")];
    if(!d||!c)return toast("بيانات غير صحيحة",true);
    if(vals(state.data.shifts).some(s=>s.driverId===d.id&&s.status==="مفتوحة"))return toast("السائق لديه وردية مفتوحة",true);
    if(!Number.isFinite(Number(openingFuel.bars)))return toast("صوّر عداد البنزين أولاً",true);
    const r=push(ref(db,"shifts"));
    await set(r,{id:r.key,shiftNo:"WR-"+Date.now(),driverId:d.id,driverName:d.name,driverPercent:Number(d.percent)||0,carId:c.id,carName:(c.brand||c.name||"")+" "+(c.model||""),status:"مفتوحة",openedAt:Date.now(),createdAt:Date.now(),custody:Math.max(0,num("sCustody")),fuelStartBars:Number(openingFuel.bars),fuelStartValue:Number(openingFuel.bars)*90,fuelStartPhoto:openingFuel.photo,fuelEndBars:null,fuelEndValue:null,fuelAdjustment:0});
    closeModal();toast("تم فتح الوردية وتسجيل العُهدة والبنزين");render();
  };
}
