<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>الأسطول الذهبي - المالك</title>
  <link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
button,input,select,textarea{font-family:inherit}button{touch-action:manipulation}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 22px #00000012;border:1px solid #e2e8f0}
.navbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;color:#334155;width:100%;font-weight:700}
.navbtn.active,.navbtn:hover{background:#fef3c7;color:#92400e}
.modal{position:fixed;inset:0;background:#0008;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
.modalbox{width:min(760px,100%);margin-top:20px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0008}
.field{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:#fff;outline:none}
.field:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #f59e0b22}
.label{font-size:13px;font-weight:700;color:#475569;margin-bottom:5px;display:block}
.btn{border-radius:12px;padding:10px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:#d97706;color:#fff}.btn-primary:hover{background:#b45309}
.btn-dark{background:#0f172a;color:#fff}.btn-green{background:#059669;color:#fff}.btn-red{background:#dc2626;color:#fff}.btn-gray{background:#e2e8f0;color:#334155}
.kpi{padding:18px;border-radius:18px;color:white;min-height:118px}
.small{font-size:12px;color:#64748b}.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;padding:12px 18px;border-radius:14px;color:#fff;box-shadow:0 10px 35px #0004}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}
.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.open{background:#dcfce7;color:#166534}.closed{background:#e2e8f0;color:#475569}
@media(max-width:900px){#sidebar{display:none}.mobile-nav{display:flex!important}.content{padding:14px!important}.grid4{grid-template-columns:repeat(2,1fr)!important}}
</style>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<!-- LOGIN -->
<section id="loginScreen" class="min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-slate-950 via-slate-800 to-amber-950">
  <div class="w-full max-w-md card p-7 text-center bg-white/95">
    <div class="w-28 h-28 mx-auto rounded-full bg-amber-500 flex items-center justify-center text-6xl shadow-xl">🚗</div>
    <h1 class="text-3xl font-black mt-5">الأسطول الذهبي</h1>
    <p class="text-slate-500 mt-2">إدارة السيارات والرحلات</p>
    <div class="mt-7 text-right">
      <label class="label">كلمة المرور</label>
      <input id="pin" class="field text-center text-2xl tracking-[.5em]" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <button id="loginBtn" class="btn btn-primary w-full mt-4 py-3">🔐 دخول</button>
    <p id="firebaseStatus" class="small mt-4">جاري الاتصال بالسحابة...</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden min-h-screen">
  <header class="bg-slate-950 text-white h-16 flex items-center justify-between px-4 sticky top-0 z-50">
    <div class="flex items-center gap-3"><button id="menuBtn" class="text-2xl">☰</button><b>🚗 الأسطول الذهبي</b></div>
    <div class="flex items-center gap-2"><span id="syncText" class="text-xs text-emerald-300">متصل</span><button id="logoutBtn" class="btn btn-gray text-xs">خروج</button></div>
  </header>

  <div class="flex">
    <aside id="sidebar" class="w-64 bg-white border-l border-slate-200 min-h-[calc(100vh-64px)] p-3 sticky top-16 self-start">
      <button class="navbtn active" data-view="dashboard">📊 التقارير</button>
      <button class="navbtn" data-view="drivers">👨‍✈️ السائقين</button>
      <button class="navbtn" data-view="cars">🚗 السيارات</button>
      <button class="navbtn" data-view="customers">👥 العملاء</button>
      <button class="navbtn" data-view="shifts">🚦 الورديات</button>
      <button class="navbtn" data-view="availableTrips">📍 الرحلات المتاحة</button>
      <button class="navbtn" data-view="treasury">🏦 الخزنة</button>
      <button class="navbtn" data-view="archive">🗄️ الأرشيف</button>
    </aside>

    <main class="content flex-1 p-5 min-w-0">
      <div id="view"></div>
    </main>
  </div>
  <div class="mobile-nav hidden fixed bottom-0 inset-x-0 bg-white border-t z-50 p-1 gap-1 overflow-x-auto">
    <button class="navbtn text-xs" data-view="dashboard">📊</button>
    <button class="navbtn text-xs" data-view="drivers">👨‍✈️</button>
    <button class="navbtn text-xs" data-view="cars">🚗</button>
    <button class="navbtn text-xs" data-view="customers">👥</button>
    <button class="navbtn text-xs" data-view="shifts">🚦</button>
    <button class="navbtn text-xs" data-view="availableTrips">📍</button>
    <button class="navbtn text-xs" data-view="treasury">🏦</button>
    <button class="navbtn text-xs" data-view="archive">🗄️</button>
  </div>
</div>

<div id="modal" class="hidden modal"><div id="modalBox" class="modalbox"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {getDatabase,ref,onValue,push,set,update,remove,get} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import {getStorage,ref as sRef,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyC2kISwx9DSEhnNujTK9nrQ0XuvLTDyYk",
 authDomain:"beesw-al-sawy.firebaseapp.com",
 databaseURL:"https://fleetsmart-2513b-default-rtdb.firebaseio.com",
 projectId:"beesw-al-sawy",
 storageBucket:"beesw-al-sawy.appspot.com",
 messagingSenderId:"313509851153",
 appId:"1:313509851153:web:57cf94a12f32a6f57901b0"
};

let app,auth,db,storage;
try{
 app=initializeApp(firebaseConfig); auth=getAuth(app); db=getDatabase(app); storage=getStorage(app);
 signInAnonymously(auth).then(()=>setStatus("متصل بفايربيز","ok")).catch(e=>setStatus("تعذر الدخول لفايربيز: "+e.message,"bad"));
}catch(e){setStatus("خطأ إعداد Firebase: "+e.message,"bad")}

const state={view:"dashboard",data:{drivers:{},cars:{},customers:{},shifts:{},trips:{},expenses:{},treasury:{},rentPayments:{},archives:{},availableTrips:{},settings:{}},currentShift:null};

function setStatus(t,type){const el=document.getElementById("firebaseStatus");if(el){el.textContent=t;el.className="small "+(type==="ok"?"text-emerald-600":"text-red-600")}}
function toast(t,bad=false){const x=document.getElementById("toast");x.textContent=t;x.className="toast "+(bad?"bg-red-600":"bg-emerald-600");setTimeout(()=>x.classList.add("hidden"),2600)}
function money(n){return (Number(n)||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2})+" ج.م"}
function now(){return Date.now()}
function dateStr(ts=Date.now()){return new Date(ts).toLocaleDateString("ar-EG")}
function dateTime(ts=Date.now()){return new Date(ts).toLocaleString("ar-EG")}
function monthKey(ts=Date.now()){const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function vals(o){return Object.entries(o||{}).map(([id,v])=>({...v,id}))}
function num(id){return Number(document.getElementById(id)?.value||0)}
function val(id){return document.getElementById(id)?.value?.trim()||""}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

async function write(path,data){await set(ref(db,path),data)}
async function add(path,data){const r=push(ref(db,path));await set(r,{...data,id:r.key});return r.key}
async function edit(path,id,data){await update(ref(db,path+"/"+id),data)}
async function del(path,id){if(confirm("تأكيد الحذف؟")){await remove(ref(db,path+"/"+id));toast("تم الحذف")}}

const paths=["drivers","cars","customers","shifts","trips","expenses","treasury","rentPayments","archives","availableTrips","settings"];
paths.forEach(p=>onValue(ref(db,p),s=>{state.data[p]=s.val()||{};if(!document.getElementById("app").classList.contains("hidden"))render()}));
onValue(ref(db,".info/connected"),s=>{document.getElementById("syncText").textContent=s.val()?"متصل":"غير متصل";document.getElementById("syncText").className=s.val()?"text-xs text-emerald-300":"text-xs text-red-300"});

document.getElementById("loginBtn").onclick=login;
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
async function login(){
 if(document.getElementById("pin").value!=="6352"){toast("كلمة المرور غير صحيحة",true);return}
 document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 render(); ensureArchive();
}
document.getElementById("logoutBtn").onclick=()=>{document.getElementById("app").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");document.getElementById("pin").value=""};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.view===state.view));render()});

function layout(title,sub=""){return `<div class="flex flex-wrap items-center justify-between gap-3 mb-5"><div><h2 class="text-2xl font-black">${title}</h2><p class="small">${sub}</p></div><div id="pageActions"></div></div>`}
function render(){const v=document.getElementById("view"); if(state.view==="dashboard")v.innerHTML=dashboard();if(state.view==="drivers")v.innerHTML=drivers();if(state.view==="cars")v.innerHTML=cars();if(state.view==="customers")v.innerHTML=customers();if(state.view==="shifts")v.innerHTML=shifts();if(state.view==="availableTrips")v.innerHTML=availableTrips();if(state.view==="treasury")v.innerHTML=treasury();if(state.view==="archive")v.innerHTML=archive();bindView()}

function monthly(filterTs=Date.now()){const mk=monthKey(filterTs);return {
 shifts:vals(state.data.shifts).filter(x=>monthKey(x.openedAt||x.createdAt)===mk),
 trips:vals(state.data.trips).filter(x=>monthKey(x.createdAt||x.date)===mk),
 expenses:vals(state.data.expenses).filter(x=>monthKey(x.createdAt||x.date)===mk)
}}
function shiftCalc(s){
 const trips=vals(state.data.trips).filter(t=>t.shiftId===s.id);
 const ex=vals(state.data.expenses).filter(e=>e.shiftId===s.id);
 const revenue=trips.reduce((a,t)=>a+(Number(t.amount)||0),0);
 const expenses=ex.filter(e=>e.type!=="مصروف شخصي للسائق").reduce((a,e)=>a+(Number(e.amount)||0),0);
 const driverPersonal=ex.filter(e=>e.type==="مصروف شخصي للسائق").reduce((a,e)=>a+(Number(e.amount)||0),0);
 const pct=(revenue*(Number(s.driverPercent)||0))/100;
 const net=revenue-expenses-pct;
 return {trips,ex,revenue,expenses,driverPersonal,pct,net};
}
function monthTotals(){
 const m=monthly();let revenue=0,expenses=0,pct=0;
 m.shifts.forEach(s=>{const c=shiftCalc(s);revenue+=c.revenue;expenses+=c.expenses;pct+=c.pct});
 const net=revenue-expenses-pct;return {revenue,expenses,pct,net,shifts:m.shifts};
}

function dashboard(){
 const t=monthTotals(), open=vals(state.data.shifts).filter(s=>s.status==="مفتوحة"), closed=vals(state.data.shifts).filter(s=>s.status==="منتهية");
 return layout("التقارير","ملخص الشهر الحالي")+"<div class='grid grid4 grid-cols-4 gap-4'>"+
 `<div class='kpi bg-slate-900'><div>إجمالي إيرادات الشهر</div><b class='text-2xl'>${money(t.revenue)}</b></div>`+
 `<div class='kpi bg-red-600'><div>إجمالي المصاريف</div><b class='text-2xl'>${money(t.expenses)}</b></div>`+
 `<div class='kpi bg-amber-600'><div>إجمالي نسب السائقين</div><b class='text-2xl'>${money(t.pct)}</b></div>`+
 `<div class='kpi bg-emerald-600'><div>الصافي</div><b class='text-2xl'>${money(t.net)}</b></div></div>`+
 `<div class='card p-4 mt-5'><div class='flex justify-between mb-3'><h3 class='font-black'>الورديات المفتوحة (${open.length})</h3><button class='btn btn-primary' data-action='newShift'>+ وردية جديدة</button></div>${shiftList(open)}</div>`+
 `<div class='card p-4 mt-5'><h3 class='font-black mb-3'>الورديات المنتهية (${closed.length})</h3>${shiftList(closed.slice().sort((a,b)=>(b.closedAt||0)-(a.closedAt||0)).slice(0,50))}</div>`;
}
function shiftList(arr){if(!arr.length)return `<p class='small'>لا توجد بيانات.</p>`;return `<div class='space-y-2'>${arr.map(s=>{const c=shiftCalc(s);return `<button class='w-full text-right border rounded-xl p-3 hover:bg-slate-50' data-action='shiftDetails' data-id='${s.id}'><div class='flex justify-between'><b>${esc(s.driverName||"بدون سائق")} — ${esc(s.carName||"بدون سيارة")}</b><span class='badge ${s.status==="مفتوحة"?"open":"closed"}'>${s.status}</span></div><div class='small mt-1'>${esc(s.shiftNo||s.id)} • ${dateTime(s.openedAt)} • الإيراد ${money(c.revenue)}</div></button>`}).join("")}</div>`}

function drivers(){
 return layout("السائقين","إدارة بيانات السائقين ومستحقاتهم الشهرية")+"<div class='flex gap-2 mb-4'><button class='btn btn-primary' data-action='newDriver'>+ إضافة سائق جديد</button></div>"+
 `<div class='grid md:grid-cols-2 lg:grid-cols-3 gap-4'>${vals(state.data.drivers).map(d=>{const m=driverTotals(d.id);return `<button data-action='driverDetails' data-id='${d.id}' class='card p-4 text-right hover:shadow-lg'><div class='text-lg font-black'>👨‍✈️ ${esc(d.name)}</div><div class='small'>${esc(d.phone||"لا يوجد هاتف")} • ${esc(d.address||"")}</div><div class='grid grid-cols-2 gap-2 mt-3 text-sm'><span>إيراد<br><b>${money(m.revenue)}</b></span><span>النسبة<br><b>${money(m.pct)}</b></span><span>مصاريف السائق<br><b>${money(m.personal)}</b></span><span>المستحق<br><b>${money(m.due)}</b></span></div><div class='mt-3 p-2 bg-amber-50 rounded-xl'>الرصيد التراكمي: <b>${money(m.balance)}</b></div></button>`}).join("")}</div>`;
}
function driverTotals(id){
 const shifts=vals(state.data.shifts).filter(s=>s.driverId===id&&monthKey(s.openedAt||s.createdAt)===monthKey());
 let revenue=0,pct=0,personal=0,paid=0;
 shifts.forEach(s=>{const c=shiftCalc(s);revenue+=c.revenue;pct+=c.pct;personal+=c.driverPersonal;paid+=Number(s.paidNow)||0});
 const due=revenue-pct-personal-paid;
 const all=vals(state.data.shifts).filter(s=>s.driverId===id);
 const balance=all.reduce((a,s)=>a+Math.max(0,(Number(s.driverDue)||0)),0)-all.reduce((a,s)=>a+(Number(s.paidNow)||0),0);
 return {revenue,pct,personal,paid,due,balance};
}

function cars(){
 return layout("السيارات","إدارة السيارات والإيجارات والحسابات")+"<button class='btn btn-primary mb-4' data-action='newCar'>+ إضافة سيارة جديدة</button>"+
 `<div class='grid md:grid-cols-2 lg:grid-cols-3 gap-4'>${vals(state.data.cars).map(c=>{const m=carTotals(c.id);return `<button data-action='carDetails' data-id='${c.id}' class='card p-4 text-right'>${c.image?`<img src='${esc(c.image)}' class='w-full h-36 object-cover rounded-xl mb-3'>`:`<div class='w-full h-36 bg-slate-100 rounded-xl flex items-center justify-center text-5xl mb-3'>🚗</div>`}<div class='font-black text-lg'>${esc(c.brand)} ${esc(c.model||"")} ${esc(c.year||"")}</div><div class='small'>${esc(c.status)} ${c.status==="إيجار"?"• "+money(c.rentMonthly)+" شهريًا":""}</div><div class='grid grid-cols-2 gap-2 mt-3 text-sm'><span>الإيراد<br><b>${money(m.revenue)}</b></span><span>المصاريف<br><b>${money(m.expenses)}</b></span><span>النسب<br><b>${money(m.pct)}</b></span><span>الصافي<br><b>${money(m.net)}</b></span></div></button>`}).join("")}</div>`;
}
function carTotals(id){
 const shifts=vals(state.data.shifts).filter(s=>s.carId===id&&monthKey(s.openedAt||s.createdAt)===monthKey());
 let revenue=0,expenses=0,pct=0;
 shifts.forEach(s=>{const c=shiftCalc(s);revenue+=c.revenue;expenses+=c.expenses;pct+=c.pct});
 return {revenue,expenses,pct,net:revenue-expenses-pct};
}

const brands=["تويوتا","نيسان","هيونداي","كيا","شيفروليه","مرسيدس","BMW","أودي","فولكس فاجن","رينو","بيجو","فيات","فورد","أوبل","سوزوكي","ميتسوبيشي","هوندا","مازدا","سكودا","سيات","جيلي","شيري","MG","BYD","بروتون","إم جي","جاك","بيستون","شانجان","هيفال","هافال","سوبارو","لكزس","إنفينيتي","فولفو","بورشه","جاكوار","لاند روفر","تسلا","دودج","جيب","كرايسلر","إيسوزو","دايهاتسو","ميتسوبيشي Fuso","MAN","مرسيدس بنز"];
const egypt=["القاهرة","الجيزة","الإسكندرية","القليوبية","الدقهلية","الشرقية","الغربية","المنوفية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","شمال سيناء","جنوب سيناء","بني سويف","الفيوم","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","الوادي الجديد","البحر الأحمر","مطروح"];
const brandOptions=brands.map(x=>`<option>${x}</option>`).join(""),govOptions=egypt.map(x=>`<option>${x}</option>`).join("");

function customers(){
 return layout("العملاء","العملاء والهواتف والمواقع")+"<button class='btn btn-primary mb-4' data-action='newCustomer'>+ إضافة عميل جديد</button>"+
 `<div class='grid md:grid-cols-2 lg:grid-cols-3 gap-4'>${vals(state.data.customers).map(c=>`<button data-action='customerDetails' data-id='${c.id}' class='card p-4 text-right'><b class='text-lg'>👥 ${esc(c.name)}</b><div class='small mt-2'>${esc(c.phone||"")}</div><div class='small'>${esc(c.address||"")}</div><div class='mt-3'>المواقع: <b>${(c.locations||[]).length}</b></div></button>`).join("")}</div>`;
}

function availableTrips(){
 const arr=vals(state.data.availableTrips||{}).sort((a,b)=>(a.tripAt||0)-(b.tripAt||0));
 return layout("الرحلات المتاحة","المالك يسجل الرحلات التي يمكن للسائقين استلامها")+
 `<button class='btn btn-primary mb-4' data-action='newAvailableTrip'>+ تسجيل رحلة جديدة</button>`+
 `<div class='grid md:grid-cols-2 lg:grid-cols-3 gap-4'>${arr.map(t=>{
   const status=t.status||"متاحة";
   const cls=status==="متاحة"?"open":status==="محجوزة"?"badge bg-amber-100 text-amber-800":"closed";
   return `<button data-action='availableTripDetails' data-id='${t.id}' class='card p-4 text-right hover:shadow-lg'>
    <div class='flex justify-between gap-2'><b class='text-lg'>${esc(t.customerName||"عميل")}</b><span class='badge ${cls}'>${esc(status)}</span></div>
    <div class='small mt-2'>${dateTime(t.tripAt)} • ${money(t.amount)}</div>
    <div class='mt-3 text-sm'>📍 ${esc(t.pickupAddress||"")}<br>🏁 ${esc(t.dropoffAddress||"")}</div>
    <div class='small mt-2'>السائق: ${esc(t.driverName||"لم تُحجز بعد")}</div>
   </button>`;
 }).join("")||"<p class='small'>لا توجد رحلات متاحة.</p>"}</div>`;
}

function availableTripForm(){
 openModal(`<h3 class='text-xl font-black mb-4'>📍 تسجيل رحلة متاحة جديدة</h3>
 <div class='grid md:grid-cols-2 gap-3'>
  <div><label class='label'>تاريخ الرحلة</label><input id='atDate' class='field' type='date' value='${new Date().toISOString().slice(0,10)}'></div>
  <div><label class='label'>وقت الرحلة</label><input id='atTime' class='field' type='time'></div>
  <div><label class='label'>قيمة الرحلة</label><input id='atAmount' class='field' type='number' step='0.01'></div>
  <div><label class='label'>اسم العميل</label><input id='atCustomer' class='field'></div>
  <div><label class='label'>رقم الهاتف</label><input id='atPhone' class='field' inputmode='tel'></div>
  <div class='md:col-span-2'><label class='label'>موقع الإقلاع</label>

 <div class='grid grid-cols-2 md:grid-cols-4 gap-2 mt-4'><div class='card p-3'>الإيرادات<br><b>${money(c.revenue)}</b></div><div class='card p-3'>المصاريف<br><b>${money(c.expenses)}</b></div><div class='card p-3'>نسبة السائق<br><b>${money(c.pct)}</b></div><div class='card p-3'>مصاريف السائق<br><b>${money(c.driverPersonal)}</b></div></div>
 <div class='mt-5 flex flex-wrap gap-2'>${s.status==="مفتوحة"?`<button class='btn btn-primary' data-action='addTrip' data-id='${id}'>+ رحلة جديدة</button><button class='btn btn-red' data-action='addExpense' data-id='${id}'>+ مصروف جديد</button><button class='btn btn-dark' data-action='finishShift' data-id='${id}'>🔒 إنهاء الوردية</button>`:"<span class='badge closed'>الوردية مغلقة ولا تقبل بيانات جديدة</span>"}</div>
 <div class='mt-5'><h4 class='font-black mb-2'>الرحلات</h4>${c.trips.map(t=>`<div class='card p-3 mb-2'><b>${money(t.amount)}</b> • ${esc(t.tripType)} • ${esc(t.paymentSummary||"")}<div class='small'>${esc(t.from||"")} ${t.to?"→ "+esc(t.to):""} • ${esc(t.app||"")} • ${dateTime(t.createdAt)}</div></div>`).join("")||"<p class='small'>لا توجد رحلات</p>"}</div>
 <div class='mt-5'><h4 class='font-black mb-2'>المصروفات</h4>${c.ex.map(e=>`<div class='card p-3 mb-2'><b>${money(e.amount)}</b> • ${esc(e.type)}<div class='small'>${esc(e.note||"")} • ${dateTime(e.createdAt)}</div>${e.image?`<a target='_blank' class='text-blue-600' href='${esc(e.image)}'>📷 عرض الصورة</a>`:""}</div>`).join("")||"<p class='small'>لا توجد مصروفات</p>"}</div>`);
 bindView();
}
function tripForm(shiftId){
 const cust=vals(state.data.customers);
 openModal(`<h3 class='text-xl font-black mb-4'>إضافة رحلة جديدة</h3><div class='grid md:grid-cols-2 gap-3'>
 <div><label class='label'>قيمة الرحلة</label><input id='tAmount' class='field' type='number' step='0.01'></div>
 <div><label class='label'>نوع الرحلة</label><select id='tType' class='field'><option>ذهاب</option><option>عودة</option><option>ذهاب وعودة</option></select></div>
 <div><label class='label'>من</label><input id='tFrom' class='field' list='govs'><datalist id='govs'>${govOptions}</datalist></div>
 <div><label class='label'>إلى</label><input id='tTo' class='field' list='govs2'><datalist id='govs2'>${govOptions}</datalist></div>
 <div><label class='label'>التطبيق</label><select id='tApp' class='field'><option>ديدي</option><option>إندرايف</option><option>أوبر</option><option>رحلة خاصة</option></select></div>
 <div id='customerBox' class='hidden'><label class='label'>العميل</label><select id='tCustomer' class='field'><option value=''>اختر</option>${cust.map(c=>`<option value='${c.id}'>${esc(c.name)}</option>`).join("")}</select></div>
 </div>
 <div class='mt-4 p-4 bg-slate-50 rounded-xl'><b>تقسيم الدفع</b><div class='grid md:grid-cols-3 gap-2 mt-2'><div><label class='label'>كاش</label><input id='cash' class='field' type='number' value='0'></div><div><label class='label'>إنستا باي</label><input id='insta' class='field' type='number' value='0'></div><div><label class='label'>محفظة</label><input id='wallet' class='field' type='number' value='0'></div></div><p id='payCheck' class='small mt-2'>المجموع: 0</p></div>
 <div class='flex gap-2 mt-5'><button id='saveTrip' class='btn btn-primary'>حفظ الرحلة</button><button class='btn btn-gray' onclick='closeModal()'>إلغاء</button></div>`);
 const updatePay=()=>{const total=num("cash")+num("insta")+num("wallet"),amount=num("tAmount");document.getElementById("payCheck").textContent=`المدفوع: ${money(total)} / قيمة الرحلة: ${money(amount)} ${Math.abs(total-amount)<.01?"✓":"— يجب أن يتساويا"}`};
 ["cash","insta","wallet","tAmount"].forEach(x=>document.getElementById(x).oninput=updatePay);
 document.getElementById("tApp").onchange=e=>document.getElementById("customerBox").classList.toggle("hidden",e.target.value!=="رحلة خاصة");
 document.getElementById("saveTrip").onclick=async()=>{
  const amount=num("tAmount"),cash=num("cash"),insta=num("insta"),wallet=num("wallet");if(amount<=0)return toast("اكتب قيمة الرحلة",true);if(Math.abs(cash+insta+wallet-amount)>.01)return toast("مجموع طرق الدفع يجب أن يساوي قيمة الرحلة",true);
  const appName=val("tApp"),customerId=val("tCustomer"),c=customerId?state.data.customers[customerId]:null;
  await add("trips",{shiftId,amount,tripType:val("tType"),from:val("tFrom"),to:val("tTo"),app:appName,customerId,customerName:c?.name||"",payments:{cash,insta,wallet},paymentSummary:`كاش ${money(cash)} • إنستا ${money(insta)} • محفظة ${money(wallet)}`,createdAt:now()});
  closeModal();toast("تم حفظ الرحلة");shiftDetails(shiftId);
 };
}
function expenseForm(shiftId){
 openModal(`<h3 class='text-xl font-black mb-4'>تسجيل مصروف</h3><div class='grid md:grid-cols-2 gap-3'>
 <div><label class='label'>نوع المصروف</label><select id='eType' class='field'><option>بنزين</option><option>مصروف شخصي للسائق</option><option>صيانة</option><option>غيار زيت</option><option>دفع مبلغ للمالك</option><option>أخرى</option></select></div>
 <div><label class='label'>المبلغ</label><input id='eAmount' class='field' type='number' step='0.01'></div>
 <div class='md:col-span-2'><label class='label'>ملاحظات</label><textarea id='eNote' class='field'></textarea></div>
 <div><label class='label'>صورة إيصال البنزين / المصروف</label><input id='eImage' class='field' type='file' accept='image/*' capture='environment'></div></div>
 <p class='small mt-2'>عند اختيار البنزين، استخدم الكاميرا لالتقاط صورة الإيصال مباشرة.</p>
 <div class='flex gap-2 mt-5'><button id='saveExpense' class='btn btn-red'>حفظ المصروف</button><button class='btn btn-gray' onclick='closeModal()'>إلغاء</button></div>`);
 document.getElementById("saveExpense").onclick=async()=>{
  const type=val("eType"),f=document.getElementById("eImage").files[0];let image="";
  try{if(f)image=await upload(f,"expenses")}catch(e){return toast("تعذر رفع الصورة: "+e.message,true)}
  await add("expenses",{shiftId,type,amount:num("eAmount"),note:val("eNote"),image,createdAt:now()});closeModal();toast("تم حفظ المصروف");shiftDetails(shiftId);
 };
}
function finishShift(id){
 const s=state.data.shifts[id],c=shiftCalc(s);
 openModal(`<h3 class='text-xl font-black'>🔒 إنهاء الوردية</h3><div class='grid grid-cols-2 gap-2 mt-4'><div class='card p-3'>إجمالي الإيراد<br><b>${money(c.revenue)}</b></div><div class='card p-3'>إجمالي المصاريف<br><b>${money(c.expenses)}</b></div><div class='card p-3'>نسبة السائق<br><b>${money(c.pct)}</b></div><div class='card p-3'>مصاريف السائق<br><b>${money(c.driverPersonal)}</b></div></div>
 <div class='mt-4'><label class='label'>المبلغ المدفوع الآن للسائق</label><input id='paidNow' class='field' type='number' value='0'></div>
 <div class='mt-3 p-4 bg-amber-50 rounded-xl'>صافي الوردية = ${money(c.net)}<br>مستحق السائق قبل الدفع = <b>${money(c.pct-c.driverPersonal)}</b><br>الباقي للرصيد التراكمي بعد الدفع سيُسجل في حساب السائق.</div>
 <div class='flex gap-2 mt-5'><button id='finishBtn' class='btn btn-dark'>حفظ وإنهاء الوردية</button><button class='btn btn-gray' onclick='closeModal()'>إلغاء</button></div>`);
 document.getElementById("finishBtn").onclick=async()=>{
  const paid=num("paidNow"),driverDue=Math.max(0,c.pct-c.driverPersonal),remaining=Math.max(0,driverDue-paid);
  await edit("shifts",id,{status:"منتهية",closedAt:now(),finalRevenue:c.revenue,finalExpenses:c.expenses,finalDriverPercent:c.pct,finalDriverPersonal:c.driverPersonal,paidNow:paid,driverDue,driverRemaining:remaining,net:c.net});
  await add("treasury",{type:"دخل - صافي وردية",amount:c.net,description:`صافي الوردية ${s.shiftNo}`,shiftId:id,createdAt:now()});
  if(paid>0)await add("treasury",{type:"خرج - دفع للسائق",amount:-paid,description:`دفع للسائق ${s.driverName} - ${s.shiftNo}`,shiftId:id,createdAt:now()});
  await ensureArchive();
  closeModal();toast("تم إنهاء الوردية وإغلاقها");render();
 };
}
function treasuryForm(type){
 openModal(`<h3 class='text-xl font-black mb-4'>${type==="دخل"?"إيداع / دخل":"سحب / خرج"}</h3><label class='label'>المبلغ</label><input id='txAmount' class='field' type='number' step='0.01'><label class='label mt-3'>البيان</label><input id='txDesc' class='field'><div class='flex gap-2 mt-5'><button id='saveTx' class='btn ${type==="دخل"?"btn-green":"btn-red"}'>حفظ</button><button class='btn btn-gray' onclick='closeModal()'>إلغاء</button></div>`);
 document.getElementById("saveTx").onclick=async()=>{let amount=num("txAmount");if(type==="خرج")amount=-Math.abs(amount);else amount=Math.abs(amount);await add("treasury",{type,amount,description:val("txDesc"),createdAt:now()});closeModal();toast("تم تسجيل الحركة");render()}
}
function rentForm(carId){
 const c=state.data.cars[carId];openModal(`<h3 class='text-xl font-black mb-4'>دفع إيجار السيارة</h3><p>${esc(c.brand)} ${esc(c.model||"")} — الإيجار الشهري ${money(c.rentMonthly)}</p><label class='label mt-3'>المبلغ المدفوع</label><input id='rAmount' class='field' type='number' value='${c.rentMonthly||0}'><label class='label mt-3'>طريقة الدفع</label><select id='rMethod' class='field'><option>كاش</option><option>تحويل بنكي</option><option>إنستا باي</option><option>محفظة</option></select><div class='flex gap-2 mt-5'><button id='saveRent' class='btn btn-primary'>تسجيل الدفع</button><button class='btn btn-gray' onclick='closeModal()'>إلغاء</button></div>`);
 document.getElementById("saveRent").onclick=async()=>{const amount=num("rAmount");await add("rentPayments",{carId,amount,method:val("rMethod"),paidAt:now(),month:monthKey()});await add("treasury",{type:"خرج - إيجار سيارة",amount:-amount,description:`إيجار ${c.brand} ${c.model||""}`,carId,createdAt:now()});closeModal();toast("تم تسجيل الإيجار");carDetails(carId)}
}
async function ensureArchive(){
 const closed=vals(state.data.shifts).filter(s=>s.status==="منتهية");
 const existing=state.data.archives||{};
 for(const s of closed){
  if(existing[s.id])continue;
  const c=shiftCalc(s);
  await write("archives/"+s.id,{id:s.id,shiftNo:s.shiftNo,driverId:s.driverId,driverName:s.driverName,carId:s.carId,carName:s.carName,openedAt:s.openedAt,closedAt:s.closedAt,revenue:c.revenue,expenses:c.expenses,pct:c.pct,driverPersonal:c.driverPersonal,net:c.net,archivedAt:now()});
 }
}
function archiveDetails(id){
 const a=state.data.archives[id];
 openModal(`<h3 class='text-2xl font-black'>🗄️ ${esc(a.shiftNo)}</h3><p class='small'>${esc(a.driverName)} • ${esc(a.carName)}</p><div class='grid grid-cols-2 gap-2 mt-4'><div class='card p-3'>الإيراد<br><b>${money(a.revenue)}</b></div><div class='card p-3'>المصاريف<br><b>${money(a.expenses)}</b></div><div class='card p-3'>النسبة<br><b>${money(a.pct)}</b></div><div class='card p-3'>الصافي<br><b>${money(a.net)}</b></div></div><p class='small mt-4'>أرشفت في ${dateTime(a.archivedAt)}</p><button class='btn btn-gray mt-4' onclick='closeModal()'>إغلاق</button>`);
}

window.closeModal=closeModal;

</script>
</body>
</html>
